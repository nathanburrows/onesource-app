<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Investment Account Planning App · Template 6</title>
<style>
:root{--bg:#0d1220;--card:#161d2e;--card2:#1c2436;--line:#28324a;--tx:#eaf0fb;--mut:#93a1bd;--acc:#3a8dff;--acc2:#25c2a0;--hot:#ff5a7a;--hdr:#0c111b;--canvas:#0b0f1a;--head:#bcd4ff;--link:#6db3ff}
body.light{--bg:#eef1f7;--card:#ffffff;--card2:#f1f4fa;--line:#d7deea;--tx:#16203a;--mut:#5c6a85;--acc:#2563eb;--acc2:#0e9e86;--hot:#e11d48;--hdr:#ffffff;--canvas:#e6eaf3;--head:#2158c9;--link:#2563eb}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
header{padding:14px 22px 0;border-bottom:1px solid var(--line);background:var(--hdr)}
h1{margin:0 0 3px;font-size:18px}.sub{color:var(--mut);font-size:12px;margin-bottom:10px}
.tabs{display:flex;gap:6px}
.tab{padding:9px 18px;border:1px solid var(--line);border-bottom:none;border-radius:9px 9px 0 0;background:var(--card);color:var(--mut);cursor:pointer;font-size:13.5px;font-weight:600}
.tab.on{background:var(--bg);color:var(--tx);border-color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
#matrix,#org{position:absolute;top:120px;left:0;right:0;bottom:0}
#matrix{overflow:auto;padding:16px 22px 60px}
.hide{display:none!important}
/* intel */
#intel{position:absolute;top:120px;left:0;right:0;bottom:0;overflow:auto;padding:18px 22px 70px}
.iwrap{max-width:1000px;margin:0 auto}
.ihead{display:flex;gap:9px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.ihead h2{margin:0;font-size:18px;color:var(--head)}
.isub{color:var(--mut);font-size:12.5px;max-width:1000px;margin:0 auto 16px}
.iq{flex:1;min-width:180px;background:var(--card);border:1px solid var(--line);color:var(--tx);padding:9px 11px;border-radius:9px;font-size:14px}
.icard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin-bottom:13px}
.icard h3{margin:0 0 9px;font-size:15.5px;color:var(--head);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.icard .ibody{font-size:13.5px;line-height:1.62;white-space:pre-wrap;color:var(--tx)}
.icard .imeta{font-size:11px;color:var(--mut);margin-top:11px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.itag{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:20px;background:var(--card2);color:var(--acc);border:1px solid var(--line)}
.iact{margin-left:auto;display:flex;gap:6px}
.iact .btn{padding:5px 9px;font-size:12px}
.iedit{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px 10px;font-size:13.5px;font-family:inherit;box-sizing:border-box}
.iempty{color:var(--mut);text-align:center;padding:46px 20px;font-size:14px;line-height:1.6}
/* sales */
#sales{position:absolute;top:120px;left:0;right:0;bottom:0;overflow:auto;padding:18px 22px 70px}
.swrap{max-width:1180px;margin:0 auto}
.shead{display:flex;gap:9px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.shead h2{margin:0;font-size:18px;color:var(--head)}
.ssub{color:var(--mut);font-size:12.5px;max-width:1180px;margin:0 auto 14px}
.skpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.skpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;min-width:130px;flex:1}
.skpi .n{font-size:22px;font-weight:800;letter-spacing:-.3px}
.skpi .l{font-size:11px;color:var(--mut);margin-top:2px;text-transform:uppercase;letter-spacing:.4px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin-bottom:14px}
.scard h3{margin:0 0 11px;font-size:14.5px;color:var(--head);display:flex;align-items:center;gap:8px}
.stable{width:100%;border-collapse:collapse;font-size:12.5px}
.stable th,.stable td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.stable th{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none}
.stable td.r,.stable th.r{text-align:right;font-variant-numeric:tabular-nums}
.stable tr:hover td{background:var(--card2)}
.stable td.wrap{white-space:normal;max-width:320px}
.sbadge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px}
.sbadge.hard{background:rgba(37,194,160,.16);color:var(--acc2);border:1px solid rgba(37,194,160,.4)}
.sbadge.estimated{background:rgba(255,193,64,.16);color:#ffc140;border:1px solid rgba(255,193,64,.4)}
.sbadge.billing{background:rgba(168,130,255,.16);color:#a882ff;border:1px solid rgba(168,130,255,.4)}
.sbar{height:9px;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2));min-width:2px}
.sbartrack{background:var(--card2);border-radius:6px;overflow:hidden;flex:1;min-width:60px}
.smini{display:flex;align-items:center;gap:9px}
.spill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--card2);color:var(--acc);border:1px solid var(--line)}
.sq{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:8px 11px;border-radius:9px;font-size:13px;min-width:180px}
.sfoot{font-size:11px;color:var(--mut);margin-top:6px}
.sempty{color:var(--mut);text-align:center;padding:46px 20px;font-size:14px;line-height:1.6}
/* matrix */
.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input#q{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line);color:var(--tx);padding:9px 11px;border-radius:9px;font-size:14px}
select,button.btn{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:8px 11px;border-radius:9px;font-size:13px;cursor:pointer}
button.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:13px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;display:flex;flex-direction:column;gap:8px}
.mcard.hot{border-left:4px solid var(--hot)}
.mtop{display:flex;gap:11px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;flex:0 0 52px;object-fit:cover;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;border:1px solid var(--line)}
.nm{font-size:15px;font-weight:650;line-height:1.2}.tt{font-size:12px;color:var(--mut);margin-top:2px}
.chip{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--card2);border:1px solid var(--line);color:var(--head)}
.stg{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.2px;white-space:nowrap}
.mcard.gone{opacity:.62;filter:grayscale(.5)}
.leftb{font-size:9px;font-weight:800;padding:1px 6px;border-radius:6px;background:#7a869c;color:#fff;letter-spacing:.5px;vertical-align:middle}
.leftsec h3{border-left-color:#7a869c!important;color:#aeb9d0!important}
.fit{font-size:12px;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;line-height:1.35}
.fit.k{border-color:#3a6b5f}.fit.k b{color:var(--acc2)}
a.lk{color:var(--link);text-decoration:none;font-size:12px}
/* org */
#orgbar{position:absolute;top:120px;left:0;right:0;height:46px;display:flex;gap:8px;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);background:var(--hdr);z-index:6;flex-wrap:wrap}
#org{top:166px}
#orgbar .btn{padding:6px 10px;font-size:12.5px}
#orgbar input[type=text]{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:6px 9px;border-radius:8px;font-size:12.5px;width:150px}
#orgbar input#orgq{width:230px}
#orgbar input#orgq:focus{outline:none;border-color:var(--acc)}
.hint{color:var(--mut);font-size:12px;margin-left:auto}
#viewport{position:absolute;top:166px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab;background-color:var(--canvas)}
#viewport.grabbing{cursor:grabbing}
#world{position:absolute;top:0;left:0;transform-origin:0 0}
#bands{position:absolute;top:0;left:0;pointer-events:none;z-index:0}
.band{position:absolute;border-radius:14px;border:1px solid rgba(255,255,255,.06)}
#tierlabels{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.tlab{position:absolute;font-size:12.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;background:rgba(9,13,22,.82);border:1px solid rgba(255,255,255,.14);padding:5px 11px;border-radius:8px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.4)}
#conn{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;z-index:1}
.node{position:absolute;width:212px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 9px 9px;cursor:grab;user-select:none;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:2}
.node .tbar{position:absolute;top:0;left:0;right:0;height:11px;border-radius:11px 11px 0 0}
.node.hot{border-color:var(--hot)}
.node.sel{outline:2px solid var(--acc)}
.node.link1{outline:2px dashed var(--acc2)}
.nhead{display:flex;gap:9px;align-items:center}
.nav{width:46px;height:46px;border-radius:50%;flex:0 0 46px;object-fit:cover;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;border:1px solid var(--line)}
.nnm{font-size:13.5px;font-weight:650;line-height:1.15}
.ntt{font-size:11px;color:var(--mut);line-height:1.2;margin-top:2px;max-height:28px;overflow:hidden}
.nloc{font-size:10.5px;color:#7d8aa5;margin-top:3px}
.nfoot{display:flex;align-items:center;gap:5px;margin-top:7px;border-top:1px solid var(--line);padding-top:6px}
.nfoot select{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--tx);font-size:10.5px;border-radius:6px;padding:3px}
.nfoot a{color:var(--link);text-decoration:none;font-size:12px}
.badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:5px;background:rgba(255,90,122,.15);color:var(--hot);border:1px solid rgba(255,90,122,.4)}
.node.dim{opacity:.28}
.node.gone{opacity:.55;filter:grayscale(.6)}
.goneflag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:#7a869c;color:#fff;font-size:9px;font-weight:800;padding:1px 7px;border-radius:6px;letter-spacing:.6px;display:none;z-index:5}
.node.gone .goneflag{display:block}
.node .plus{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;border:2px solid var(--canvas);display:none;align-items:center;justify-content:center;font-size:16px;line-height:1;cursor:pointer;z-index:4}
.node:hover .plus{display:flex}
.node .plus:hover{background:#5aa0ff}
.node.droptarget{outline:3px solid var(--acc2);box-shadow:0 0 0 5px rgba(37,194,160,.25)}
.node.find{outline:3px solid var(--acc2);box-shadow:0 0 0 6px rgba(37,194,160,.3);z-index:5}
.nnm[contenteditable]:focus{outline:none;background:var(--card2);border-radius:4px;padding:0 3px}
.mcard{cursor:pointer;transition:box-shadow .15s}
.mcard:hover{border-color:var(--acc)}
.mcard.flash{outline:2px solid var(--acc);box-shadow:0 0 0 5px rgba(58,141,255,.3)}
#detail{position:absolute;top:120px;right:0;bottom:0;width:400px;max-width:94vw;background:var(--card);border-left:1px solid var(--line);transform:translateX(107%);transition:transform .22s;z-index:40;overflow:auto;padding:18px}
#detail.on{transform:none}
#detail h4{margin:16px 0 4px;font-size:11px;letter-spacing:.4px;color:var(--head);text-transform:uppercase}
.dlink{color:var(--link);cursor:pointer;text-decoration:none;font-weight:600}
.dlink:hover{text-decoration:underline}
.drow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.dav{width:34px;height:34px;border-radius:50%;flex:0 0 34px;object-fit:cover;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:1px solid var(--line);color:#fff}
.dsub{font-size:11px;color:var(--mut)}
.node .col{position:absolute;top:-11px;left:-10px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--acc);color:#fff;border:2px solid var(--canvas);display:none;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;cursor:pointer;z-index:5}
.node .col.cin{background:var(--mut)}
.node .col:hover{filter:brightness(1.12)}
.node .info{position:absolute;top:-10px;right:-9px;width:22px;height:22px;border-radius:50%;background:var(--card2);border:1px solid var(--line);color:var(--head);display:none;align-items:center;justify-content:center;font-size:12px;cursor:pointer;z-index:4}
.node:hover .info{display:flex}
.node .ndot{position:absolute;top:7px;right:9px;font-size:11px}
textarea:focus{outline:none;border-color:var(--acc)}
.gsec{margin-bottom:20px}
.gsec h3{font-size:12.5px;letter-spacing:.3px;color:var(--head);text-transform:uppercase;margin:4px 0 11px;border-left:3px solid var(--acc);padding-left:10px;display:flex;align-items:center;gap:8px}
.gsec h3 span{color:var(--mut);font-size:11px;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-weight:600}
button.btn.add{background:var(--acc2);border-color:var(--acc2);color:#04231c;font-weight:700}
#meinit{width:56px;background:var(--card);border:1px solid var(--line);color:var(--tx);padding:8px 8px;border-radius:9px;font-size:13px;text-align:center;text-transform:uppercase}
#meinit:focus{outline:none;border-color:var(--acc)}
#hdrlogo{height:32px;max-width:140px;object-fit:contain;border-radius:6px;border:1px solid var(--line);background:#fff;padding:2px 4px;display:none;cursor:pointer}
#logobtn{padding:6px 9px}
#merge{position:fixed;inset:0;background:rgba(4,8,16,.62);display:none;align-items:center;justify-content:center;z-index:60}
#merge.on{display:flex}
#merge .box{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:660px;width:92vw;max-height:86vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#merge .box b{font-size:15px}
.cfrow{border:1px solid var(--line);border-radius:10px;padding:11px;margin:10px 0;background:var(--card2)}
.cfrow .opt{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.cfrow .opt button{flex:1;min-width:180px;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px 10px;cursor:pointer;font-size:12.5px;line-height:1.3}
.cfrow .opt button.pick{border-color:var(--acc2);box-shadow:0 0 0 2px rgba(37,194,160,.35)}
.cfrow .opt button .who{display:block;font-size:10.5px;color:var(--mut);margin-bottom:2px;text-transform:uppercase;letter-spacing:.3px}
.mstat{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 18px;text-align:center;min-width:96px}
.mnum{font-size:26px;font-weight:800;color:var(--acc2)}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;min-width:260px;max-width:92vw;padding:12px 15px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 12px 34px rgba(0,0,0,.45);border:1px solid var(--line);background:var(--card);color:var(--tx);display:flex;gap:10px;align-items:flex-start;animation:tin .2s ease}
.toast .ic{font-size:16px;line-height:1.2}
.toast.ok{border-left:4px solid var(--acc2)}
.toast.err{border-left:4px solid var(--hot)}
.toast.info{border-left:4px solid var(--acc)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#portfolio{position:absolute;top:120px;left:0;right:0;bottom:0;overflow:auto;padding:18px 22px 60px}.ptable{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}.ptable th,.ptable td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}.ptable th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px}.ptable tr.arow{cursor:pointer}.ptable tr.arow:hover td{background:var(--card2)}.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}.pill.ok{background:rgba(37,194,160,.16);color:var(--acc2)}.pill.no{background:rgba(147,161,189,.14);color:var(--mut)}.pill.risk{background:rgba(255,90,122,.16);color:var(--hot)}.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}.pkpi{display:flex;gap:26px;flex-wrap:wrap}.pkpi .n{font-size:24px;font-weight:800}.pkpi .l{font-size:11px;color:var(--mut)}#acctsel{max-width:230px;font-weight:600}
</style></head><body>
<div id="STATE" style="display:none"></div>
<header>
<div style="display:flex;align-items:center;gap:9px;margin-bottom:2px;overflow:hidden">
 <select id="acctsel" title="Switch account"></select>
 <button class="btn" id="acctrename" title="Rename this account" style="padding:6px 9px">✎</button>
 <button class="btn" id="acctdel" title="Delete this account from this browser" style="padding:6px 9px">🗑</button>
 <h1 id="acctname" style="margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Account</h1>
 <span style="font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);font-weight:700;white-space:nowrap">· Investment Account Planning App</span>
</div>
<div class="sub" id="acctsub">—</div>
<div class="tabs"><div class="tab on" data-t="matrix">▤ Matrix</div><div class="tab" data-t="org">🗂 Org Chart</div><div class="tab" data-t="portfolio">📊 Portfolio</div><div class="tab" data-t="intel">📁 Intel</div><div class="tab" data-t="sales">💰 Sales</div>
 <div style="margin-left:auto;display:flex;gap:6px;align-items:center;padding-bottom:7px">
  <img id="hdrlogo" alt="logo" title="Company logo · double-click to remove"><button class="btn" id="logobtn" title="Upload a company logo for the header">🖼 Logo</button><input type="file" id="logof" accept="image/*" class="hide">
  <input id="meinit" placeholder="You" maxlength="4" title="Your initials — stamped onto any contact you edit, so merges can show who changed what">
  <button class="btn" id="theme" title="Switch between dark and light theme">🌙 Dark</button>
  <button class="btn add" id="save" title="Save a self-contained copy that opens with your changes on ANY browser — Ctrl+S">💾 Save &amp; Share</button>
  <button class="btn" id="undo" title="Undo (Ctrl+Z)">↶</button><button class="btn" id="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
  <button class="btn" id="expo" title="Export a data-only JSON backup of your edits">⭳ Export</button>
  <button class="btn" id="impo" title="Import your edits from a saved app HTML file OR a JSON backup — brings your data into THIS (newest) version">⭱ Import edits</button><input type="file" id="impf" accept=".json,.html,.htm,application/json,text/html" class="hide">
  <button class="btn add" id="newacct" title="Create a new account">＋ New</button><button class="btn" id="clearacct" title="Clear this account’s contacts">🧹 Clear</button>
 </div></div>
</header>

<div id="matrix">
 <div class="controls">
  <input id="q" placeholder="Search name, title, role, location, notes…">
  <select id="groupby"><option value="fn">Group: Function</option><option value="loc">Group: Location</option><option value="prio">Group: Relationship</option><option value="mgr">Group: Manager</option><option value="none">Group: None</option></select>
  <select id="sort"><option value="name">Sort: Name</option><option value="pri">Sort: Priority</option><option value="loc">Sort: Location</option><option value="title">Sort: Title</option></select>
  <button class="btn" id="prio">⚑ Tagged only</button>
  <button class="btn add" id="addc">＋ Add contact</button>
 </div>
 <div class="grid" id="mgrid"></div>
</div>
<div id="portfolio" class="hide"></div>

<div id="detail"></div>
<div id="intel" class="hide"></div>
<div id="sales" class="hide"></div>
<div id="orgbar" class="hide">
 <input type="text" id="orgq" placeholder="🔍 Find a contact…" title="Type a name, title, role or location — the chart dims everything else and jumps to the match">
 <button class="btn" id="orgqx" title="Clear search">✕</button>
 <span style="width:1px;height:22px;background:var(--line)"></span>
 <button class="btn" id="zin">＋</button><button class="btn" id="zout">－</button>

/* ---------- MATRIX ---------- */
let prioOnly=false;
function mcard(p){const d=stDef(p);const note=p.notes?' 📝':'';
 return `<div class="mcard ${p.left?'gone':''}" data-id="${p.id}" style="${p.left?'':glowCss(d)}"><div class="mtop">${av(p,'av')}<div><div class="nm">${esc(p.name)}${p.left?' <span class="leftb">LEFT</span>':''}${note}</div><div class="tt">${esc(p.title||'— profile pending —')}</div></div></div>
 ${d&&!p.left?`<div>${stChip(d)}</div>`:''}
 <div style="display:flex;gap:6px;flex-wrap:wrap">${p.role?`<span class="chip">${esc(p.role)}</span>`:''}${p.loc?`<span class="chip" style="color:var(--mut)">${esc(p.loc)}</span>`:''}</div>
 ${p.fit?`<div class="fit ${d?'k':''}">${d?'<b>▲ </b>':''}${esc(p.fit)}</div>`:''}
 ${p.notes?`<div class="dsub" style="border-left:2px solid var(--acc);padding-left:8px">${esc(p.notes).slice(0,140)}</div>`:''}
 <div style="display:flex;justify-content:space-between">${p.li?`<a class="lk" href="${p.li}" target="_blank">LinkedIn ▶</a>`:'<span class="dsub">No LinkedIn</span>'}${p.email?`<a class="lk" href="mailto:${p.email}">${esc(p.email)}</a>`:''}</div>
 <div class="dsub" style="margin-top:3px">🕒 Updated ${fmtDate(p.updated)}${p.by?' · by '+esc(p.by):''}</div></div>`;}
function bucketOf(p){const r=((p.role||'')+' '+(p.title||'')).toLowerCase();
 if(/vice president|\bvp\b|\bsvp\b|chief|\bcio\b|\bcto\b/.test(r))return 'Executive Sponsors';
 if(/security|infosec|\biam\b/.test(r))return 'Information Security';
 if(/financ|procure|sourcing|purchas/.test(r))return 'Finance & Procurement';
 if(/program management|\bpmo\b/.test(r))return 'Program Management';
 if(/network|telecom|citrix/.test(r))return 'Network, Telecom & Citrix';
 if(/end.?user|workplace|service desk|desktop|service delivery|contact cent|telephony|help ?desk/.test(r))return 'End-User & Service Delivery';
 if(/infrastructur|data ?cent|storage|backup|vmware|linux|windows|unix|private cloud|\bcloud\b|systems|server|hpc|hadoop|\bdba\b|\bsre\b/.test(r))return 'Infrastructure & Data Center';
 if(/\bdata\b|analytics|\bai\b|architect|machine learning/.test(r))return 'Data, AI & Architecture';
 return 'Other / To confirm';}
function grpKey(p){const g=document.getElementById('groupby').value;
 if(g==='fn')return FUNCTIONS.includes(p.role)?p.role:bucketOf(p);
 if(g==='loc')return (p.loc||'').split(',')[0].trim()||'— No location —';
 if(g==='prio'){const d=stDef(p);return d?(d.emoji+' '+d.label):'○ Unmapped';}
 if(g==='mgr'){const m=reports[p.id];return (m&&byId[m])?('Reports to '+byId[m].name):'— No manager set —';}
 return 'All contacts';}
function mSort(s){return (a,b)=> s==='name'?a.name.localeCompare(b.name): s==='loc'?(a.loc||'~').localeCompare(b.loc||'~'): s==='title'?(a.title||'~').localeCompare(b.title||'~'): ((a.priority-b.priority)||a.name.localeCompare(b.name));}
function renderMatrix(){
 const q=document.getElementById('q').value.toLowerCase().trim();
 const s=document.getElementById('sort').value, g=document.getElementById('groupby').value;
 let l=PEOPLE.filter(p=>{if(prioOnly&&!stDef(p))return false;if(!q)return true;return [p.name,p.title,p.role,p.loc,p.fit,p.email,p.notes,p.stance].join(' ').toLowerCase().includes(q);});
 const cmp=mSort(s);
 const left=l.filter(p=>p.left), active=l.filter(p=>!p.left);
 let html='';
 if(g==='none'){html=`<div class="grid">${active.sort(cmp).map(mcard).join('')}</div>`;}
 else{
   const groups={};active.forEach(p=>{const k=grpKey(p);(groups[k]=groups[k]||[]).push(p);});
   const keys=Object.keys(groups).sort((a,b)=>{const na=a[0]==='—',nb=b[0]==='—';if(na!==nb)return na?1:-1;const sa=a[0]==='★',sb=b[0]==='★';if(sa!==sb)return sa?-1:1;return a.localeCompare(b);});
   html=keys.map(k=>`<div class="gsec"><h3>${esc(k)} <span>${groups[k].length}</span></h3><div class="grid">${groups[k].sort(cmp).map(mcard).join('')}</div></div>`).join('');
 }
 if(left.length){html+=`<div class="gsec leftsec"><h3>🚪 Left Company <span>${left.length}</span></h3><div class="grid">${left.sort(cmp).map(mcard).join('')}</div></div>`;}
 document.getElementById('mgrid').innerHTML=html||'<div class="tt">No contacts match.</div>';
}
function newContact(name){const id='x'+Date.now();const p={id,name:name||'New contact',title:'',role:'',loc:'',email:'',li:'',fit:'',notes:'',photo:'',priority:3,updated:today(),by:meInit||''};pushUndo();PEOPLE.push(p);byId[id]=p;reports[id]='';if(orgReady){makeNode(p);pos[id]={x:(-tx+viewport.clientWidth/2)/scale,y:(-ty+150)/scale};refreshSelects();layout();}renderMatrix();openDetail(id,true);return id;}
document.getElementById('q').oninput=renderMatrix;
document.getElementById('groupby').onchange=renderMatrix;
document.getElementById('sort').onchange=renderMatrix;
document.getElementById('prio').onclick=e=>{prioOnly=!prioOnly;e.target.classList.toggle('on',prioOnly);renderMatrix();};

/* ---------- INTEL ---------- */
let intelQ='', intelEditId=null;
function iid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function intelMatch(it){if(!intelQ)return true;const q=intelQ.toLowerCase();return [(it.title||''),(it.body||''),(it.tag||'')].join(' ').toLowerCase().includes(q);}
function ilink(s){return s.replace(/(https?:\/\/[^\s<]+)/g,'<a class="lk" href="$1" target="_blank" rel="noopener">$1</a>');}
function intelViewCard(it){return `<div class="icard" data-iid="${esc(it.id)}">
  <h3>${esc(it.title||'Untitled')}${it.tag?` <span class="itag">${esc(it.tag)}</span>`:''}
   <span class="iact"><button class="btn" data-iedit="${esc(it.id)}">✎ Edit</button><button class="btn" data-idel="${esc(it.id)}" title="Delete">🗑</button></span></h3>
  <div class="ibody">${ilink(esc(it.body||'')) || '<span style="color:var(--mut)">— no details —</span>'}</div>
  <div class="imeta">🕒 ${it.updated?fmtDate(it.updated):'—'}${it.by?' · by '+esc(it.by):''}</div></div>`;}
function intelEditCard(it){const isNew=it.id==='__new__';return `<div class="icard" data-iid="${esc(it.id)}">
  <input class="iedit" id="ie_title" placeholder="Title (e.g. Company Overview, Zoom Sales Play)" value="${esc(it.title||'')}" style="font-weight:700;font-size:15px;margin-bottom:8px">
  <input class="iedit" id="ie_tag" placeholder="Tag (optional — e.g. Briefing, Competitive, Sales Play)" value="${esc(it.tag||'')}" style="margin-bottom:8px">
  <textarea class="iedit" id="ie_body" rows="9" placeholder="Details… paste freely — links become clickable.">${esc(it.body||'')}</textarea>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn" data-icancel="1">Cancel</button><button class="btn add" data-isave="${esc(it.id)}">${isNew?'Add intel':'Save'}</button></div></div>`;}
function renderIntel(){const host=document.getElementById('intel');
 host.innerHTML='<div class="iwrap"><div class="ihead"><h2>📁 Account Intel</h2>'+
  '<input class="iq" id="intelq" placeholder="Search intel…">'+
  '<button class="btn add" id="iadd">＋ Add intel</button>'+
  '<button class="btn" id="ipaste" title="Paste any block of text — first line becomes the title">📋 Paste to add</button></div>'+
  '<div class="isub">Freeform intel on this account — briefings, sales plays, competitive notes, anything worth capturing. Add a card or paste a block of text (first line becomes the title). Everything here saves &amp; shares with the account.</div>'+
  '<div id="intelcards"></div></div>';
 const q=document.getElementById('intelq');q.value=intelQ;q.oninput=()=>{intelQ=q.value;renderIntelCards();};
 document.getElementById('iadd').onclick=()=>{intelEditId='__new__';renderIntelCards();setTimeout(()=>{const t=document.getElementById('ie_title');if(t)t.focus();},20);};
 document.getElementById('ipaste').onclick=pasteIntel;
 renderIntelCards();}
function renderIntelCards(){const host=document.getElementById('intelcards');if(!host)return;
 const items=intel.filter(intelMatch);let h='';
 if(intelEditId==='__new__')h+=intelEditCard({id:'__new__',title:'',body:'',tag:''});
 if(!items.length&&intelEditId!=='__new__')h+=`<div class="iempty">${intel.length?'No intel matches your search.':'No intel yet.<br>Click <b>＋ Add intel</b> or <b>📋 Paste to add</b> to capture your first briefing.'}</div>`;
 items.forEach(it=>{h+=(intelEditId===it.id)?intelEditCard(it):intelViewCard(it);});
 host.innerHTML=h;wireIntelCards(host);}
function wireIntelCards(host){host=host||document.getElementById('intelcards');if(!host)return;
 host.querySelectorAll('[data-iedit]').forEach(b=>b.onclick=()=>{intelEditId=b.dataset.iedit;renderIntelCards();});
 host.querySelectorAll('[data-icancel]').forEach(b=>b.onclick=()=>{intelEditId=null;renderIntelCards();});
 host.querySelectorAll('[data-idel]').forEach(b=>b.onclick=()=>{const id=b.dataset.idel;const it=intel.find(x=>x.id===id);confirmBox('Delete this intel card'+(it&&it.title?' “'+it.title+'”':'')+'? This can be undone.',()=>{pushUndo();intel=intel.filter(x=>x.id!==id);if(intelEditId===id)intelEditId=null;scheduleAutosave();renderIntelCards();setHint('Intel deleted. (Undo to restore.)');},'Delete');});
 host.querySelectorAll('[data-isave]').forEach(b=>b.onclick=()=>{const id=b.dataset.isave;const T=host.querySelector('#ie_title'),TG=host.querySelector('#ie_tag'),B=host.querySelector('#ie_body');if(!T||!B)return;const t=T.value.trim(),tag=(TG?TG.value:'').trim(),body=B.value;
   if(!t&&!body.trim()){T.focus();return;}pushUndo();
   if(id==='__new__'){intel.unshift({id:iid(),title:t||'Untitled',tag:tag,body:body,updated:today(),by:meInit||''});}
   else{const it=intel.find(x=>x.id===id);if(it){it.title=t||'Untitled';it.tag=tag;it.body=body;it.updated=today();it.by=meInit||'';}}
   intelEditId=null;scheduleAutosave();renderIntelCards();setHint('Intel saved.');});}
function pasteIntel(){const m=document.getElementById('merge');const box=m.querySelector('.box');const st="width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px 10px;font-size:13.5px;font-family:inherit;box-sizing:border-box";
 box.innerHTML=`<b>Paste intel</b><div class="dsub" style="margin:8px 0 10px">Paste any block of text — the <b>first line</b> becomes the title, the rest becomes the body. Ideal for dropping in a briefing, an email, or raw notes.</div>
  <textarea id="pi_body" rows="12" placeholder="Paste here…" style="${st}"></textarea>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn" id="pi_cancel">Cancel</button><button class="btn add" id="pi_ok">Add intel</button></div>`;
 m.classList.add('on');const ta=box.querySelector('#pi_body');setTimeout(()=>ta.focus(),40);
 box.querySelector('#pi_cancel').onclick=closeMerge;
 box.querySelector('#pi_ok').onclick=()=>{const raw=ta.value.replace(/\r/g,'').trim();if(!raw){ta.focus();return;}const nl=raw.indexOf('\n');const title=(nl<0?raw:raw.slice(0,nl)).trim().slice(0,120);const body=(nl<0?'':raw.slice(nl+1)).trim();pushUndo();intel.unshift({id:iid(),title:title||'Pasted intel',tag:'',body:body,updated:today(),by:meInit||''});scheduleAutosave();closeMerge();if(!document.getElementById('intel').classList.contains('hide'))renderIntelCards();setHint('Added pasted intel.');toast('Intel added — open it to add a tag or tidy the title.','ok',4200);};}

let salesQ='', salesSort={col:'_renewalDate',dir:'asc'};
function usd(n){n=Number(n)||0;const neg=n<0;n=Math.abs(n);let s;if(n>=1e6)s='$'+(n/1e6).toFixed(n>=1e7?1:2)+'M';else if(n>=1e3)s='$'+(n/1e3).toFixed(0)+'K';else s='$'+Math.round(n);return neg?'-'+s:s;}
function usdFull(n){n=Number(n)||0;return (n<0?'-$':'$')+Math.abs(Math.round(n)).toLocaleString();}
function salesChains(){const rows=(salesData&&salesData.rows)||[];const m=new Map();
 rows.forEach(r=>{const k=r._chainKey||('|'+r.id);let c=m.get(k);if(!c){c={key:k,date:r._renewalDate||null,type:r._renewalType||null,term:r._termYears||null,mixed:!!r._isMixedTerm,vendor:r.mfg||'—',customer:r.customer||'',desc:r.desc||'',sell:0,margin:0,lines:0,confidence:r._confidence||null};m.set(k,c);}
  c.sell+=Number(r.netSell)||0;c.margin+=Number(r.netProfit)||0;c.lines++;
  if(r._renewalDate&&(!c.date||r._renewalType))c.date=r._renewalDate;
  if(r._renewalType)c.type=r._renewalType;if(r._termYears)c.term=r._termYears;if(r._isMixedTerm)c.mixed=true;
  if((Number(r.netSell)||0)>0&&(r.desc||'').length>(c.desc||'').length)c.desc=r.desc;});
 return [...m.values()];}
function sBadge(t){if(!t)return '';const lab=t==='hard'?'Warranty':t==='estimated'?'Estimated':t==='billing'?'Annual bill':t;return `<span class="sbadge ${t}">${lab}</span>`;}
function renderSales(){const host=document.getElementById('sales');
 if(!salesData||!salesData.rows||!salesData.rows.length){host.innerHTML='<div class="swrap"><div class="sempty">No sales data loaded for this account.<br>The IQVIA account ships with ePlus / OneSource sales history; other accounts can have their own added later.</div></div>';return;}

function childrenOf(id){return PEOPLE.filter(p=>reports[p.id]===id).map(p=>p.id);}
function isDescendant(anc,node){let cur=reports[node],g=0;while(cur&&g++<300){if(cur===anc)return true;cur=reports[cur];}return false;}
function isHidden(id){let cur=reports[id],g=0;while(cur&&g++<400){if(collapsed.has(cur))return true;cur=reports[cur];}return false;}
/* departed / "left company" handling */
function leftHidden(id){return !!(byId[id]&&byId[id].left)&&!showLeft;}
function isOrgHidden(id){return isHidden(id)||leftHidden(id);}
function effMgr(id){let m=reports[id],g=0;while(m&&byId[m]&&leftHidden(m)&&g++<500){m=reports[m];}return (m&&byId[m])?m:'';}
function effChildrenOf(id){return PEOPLE.filter(p=>!isOrgHidden(p.id)&&effMgr(p.id)===id).map(p=>p.id);}
function effRoots(){return PEOPLE.map(p=>p.id).filter(n=>!isOrgHidden(n)&&!effMgr(n));}

   if(ch.length===0){const c=col++;pos[n]=place2(c,depth);return {c,d:depth};}
   let cols=[];ch.forEach(c=>cols.push(place(c,depth+1).c));
   const c=(Math.min(...cols)+Math.max(...cols))/2;pos[n]=place2(c,depth);return {c,d:depth};

   const baseX=placed.length?Math.max(...placed.map(p=>p.x)):0;
   const gx=baseX+NW+HGAP+30;
   singles.forEach((n,i)=>{seen.add(n);pos[n]={x:gx+Math.floor(i/gcols)*(NW+HGAP),y:(i%gcols)*(NH+VGAP)};});
 } else {
   const gy=baseY+NH+VGAP+30;
   singles.forEach((n,i)=>{seen.add(n);pos[n]={x:(i%gcols)*(NW+HGAP),y:gy+Math.floor(i/gcols)*(NH+VGAP)};});
 }
 PEOPLE.forEach(p=>{if(!pos[p.id]&&!isOrgHidden(p.id))pos[p.id]={x:(col++)*(NW+HGAP),y:0};});

function layout(){for(const id in nodeEls){const hid=isOrgHidden(id);nodeEls[id].style.display=hid?'none':'';nodeEls[id].classList.toggle('gone',!!(byId[id]&&byId[id].left));if(!hid&&pos[id]){nodeEls[id].style.left=pos[id].x+'px';nodeEls[id].style.top=pos[id].y+'px';}updateColl(id);updateNodeTier(id);}drawConns();drawBands();}
function tierArrange(){
 const present=TIER_DEFS.filter(t=>PEOPLE.some(p=>tierKey(p)===t.key&&!isOrgHidden(p.id)));
 const rowOf={};present.forEach((t,i)=>rowOf[t.key]=i);
 const order=[],seen=new Set();
 function dfs(id){if(seen.has(id))return;seen.add(id);order.push(id);if(!collapsed.has(id))effChildrenOf(id).forEach(dfs);}
 effRoots().forEach(dfs);
 PEOPLE.forEach(p=>{if(!seen.has(p.id)&&!isOrgHidden(p.id)){seen.add(p.id);order.push(p.id);}});
 const col={};
 order.forEach(id=>{if(isOrgHidden(id))return;const k=tierKey(byId[id]);const r=rowOf[k]||0;const c=(col[k]=(col[k]==null?0:col[k]+1));
   pos[id]=orient==='h'?{x:r*(NW+HGAP),y:c*(NH+VGAP)}:{x:c*(NW+HGAP),y:r*(NH+VGAP)};});

/* Tier + reporting FLOW: y = seniority band, x = tidy-tree so each manager's
   whole downline sits in one contiguous column and lines skip bands cleanly. */
function tierTreeArrange(){
 const present=TIER_DEFS.filter(t=>PEOPLE.some(p=>tierKey(p)===t.key&&!isOrgHidden(p.id)));
 const rowOf={};present.forEach((t,i)=>rowOf[t.key]=i);
 let col=0;const xcol={},seen=new Set();
 function assign(id){
   if(seen.has(id))return xcol[id];seen.add(id);
   const kids=collapsed.has(id)?[]:effChildrenOf(id).filter(c=>!seen.has(c));
   if(!kids.length){xcol[id]=col++;return xcol[id];}
   const cs=kids.map(assign);
   xcol[id]=(Math.min(...cs)+Math.max(...cs))/2;return xcol[id];
 }
 const roots=effRoots();
 const trees=roots.filter(n=>effChildrenOf(n).length),singles=roots.filter(n=>!effChildrenOf(n).length);
 trees.forEach(r=>{assign(r);col+=0.6;});
 singles.forEach(r=>{assign(r);col+=0.2;});
 PEOPLE.forEach(p=>{if(!isOrgHidden(p.id)&&xcol[p.id]==null)xcol[p.id]=col++;});
 PEOPLE.forEach(p=>{if(isOrgHidden(p.id))return;const k=tierKey(p),r=rowOf[k]||0,c=xcol[p.id]||0;
   pos[p.id]=orient==='h'?{x:r*(NW+HGAP),y:c*(NH+VGAP)}:{x:c*(NW+HGAP),y:r*(NH+VGAP)};});
 // prevent overlap of unrelated nodes sharing a tier, preserving left→right (flow) order
 present.forEach(t=>{const ns=PEOPLE.filter(p=>!isOrgHidden(p.id)&&tierKey(p)===t.key&&pos[p.id]);
   if(orient==='h'){ns.sort((a,b)=>pos[a.id].y-pos[b.id].y);let last=-1e9;ns.forEach(p=>{if(pos[p.id].y<last+NH+40)pos[p.id].y=last+NH+40;last=pos[p.id].y;});}
   else{ns.sort((a,b)=>pos[a.id].x-pos[b.id].x);let last=-1e9;ns.forEach(p=>{if(pos[p.id].x<last+NW+HGAP)pos[p.id].x=last+NW+HGAP;last=pos[p.id].x;});}
 });
 layout();
}

 });

let drag=null, linkMode=false, linkFirst=null, dropTarget=null, dragOff=null, edgeTimer=null, lastMouseX=0, lastMouseY=0;

function setPhoto(f,p,id){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const S=300;let w=img.width,h=img.height,sc=Math.min(S/w,S/h,1);w=Math.round(w*sc);h=Math.round(h*sc);c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);touch();p.photo=c.toDataURL('image/jpeg',0.85);markUpdated(id);openDetail(id);refreshViews();};img.src=r.result;};r.readAsDataURL(f);}

function extractState(txt){
 let j=null;
 try{j=JSON.parse(txt);}catch(e){}                       // a JSON backup
 if(!j||!j.people){                                      // or a saved app HTML file
   try{const doc=new DOMParser().parseFromString(txt,'text/html');const st=doc.getElementById('STATE');if(st&&st.textContent.trim())j=JSON.parse(st.textContent);}catch(e){}
 }
 return (j&&j.people)?j:null;
}
document.getElementById('impf').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{const j=extractState(rd.result);
  if(!j){toast('Couldn’t read “'+f.name+'” — import a saved app HTML file, or a JSON backup.','err',6500);ev.target.value='';return;}
  const incId=j.accountId;const existing=incId&&ACCOUNTS.find(a=>a.id===incId);
  if(existing){ if(incId!==curAcct)switchAccount(incId); openImportChoice(j,f.name); }
  else{ const guess=(j.accountName&&j.accountName.trim())||cleanAcctName(f.name);
   promptAccountName('Name this imported account',(nm)=>{ const id=incId||genAcctId();
     saveCurrentAccount(); if(!ACCOUNTS.find(a=>a.id===id))ACCOUNTS.push({id,name:nm});
     storeAcct(id,JSON.stringify(Object.assign({},j,{accountId:id,accountName:nm}))); writeIndex(); switchAccount(id);
     toast('Imported “'+nm+'” as a new account.','ok',5500);
   }, guess); }
  ev.target.value='';
 };
 rd.readAsText(f);};

/* ---------- IMPORT: replace vs smart merge ---------- */
const MFIELDS=[['name','Name'],['title','Title'],['role','Role / Function'],['loc','Location'],['email','Email'],['li','LinkedIn'],['fit','Opportunity fit'],['notes','Notes'],['stance','Relationship'],['left','Left company'],['priority','Priority'],['tier','Seniority tier']];
function fLabel(f){if(f==='__mgr')return 'Reports to';if(f==='photo')return 'Photo';const h=MFIELDS.find(x=>x[0]===f);return h?h[1]:f;}
function vStr(f,v){if(f==='priority')return v===1?'★ Priority':'Standard';if(f==='__mgr')return v?(byId[v]?byId[v].name:'(unknown)'):'— no manager —';return (v===''||v==null)?'—':(''+v);}
function meLabel(){return meInit||'This file';}
function closeMerge(){document.getElementById('merge').classList.remove('on');}
function openImportChoice(j,fn){const m=document.getElementById('merge');const box=m.querySelector('.box');
 box.innerHTML=`<b>Import “${esc(fn)}”</b><div class="dsub" style="margin:8px 0 14px">${j.people.length} contacts found in that file. How should I bring them in?</div>
  <div class="cfrow"><b>🔀 Smart merge</b><div class="dsub" style="margin-top:4px">Keep your current data and blend their file in. Changes only one of you made apply automatically; you'll pick a value only where you both changed the SAME field. New contacts on either side are kept.</div><button class="btn add" id="ichoose_merge" style="margin-top:9px">Smart merge</button></div>
  <div class="cfrow"><b>♻ Replace everything</b><div class="dsub" style="margin-top:4px">Discard what's here and load their file exactly as-is. Use this to adopt a fresh master, or to move an older file's data into this newest version.</div><button class="btn" id="ichoose_replace" style="margin-top:9px">Replace all</button></div>
  <div style="text-align:right;margin-top:10px"><button class="btn" id="icancel">Cancel</button></div>`;
 m.classList.add('on');
 box.querySelector('#ichoose_merge').onclick=()=>{closeMerge();doMerge(j);};
 box.querySelector('#ichoose_replace').onclick=()=>{closeMerge();replaceWith(j);};
 box.querySelector('#icancel').onclick=closeMerge;
}
function replaceWith(j){pushUndo();PEOPLE.length=0;Object.keys(byId).forEach(k=>delete byId[k]);j.people.forEach(p=>{PEOPLE.push(p);byId[p.id]=p;});reports={};Object.assign(reports,j.reports||{});pos={};Object.assign(pos,j.pos||{});if(j.orient)orient=j.orient;if(j.layout)orgLayout=j.layout;else if('tiers' in j)orgLayout=j.tiers?'tiergroup':'tree';tiersOn=(orgLayout!=='tree');if('showLeft' in j)showLeft=!!j.showLeft;collapsed=new Set(j.collapsed||[]);if(j.theme){theme=j.theme;applyTheme();}syncOrientBtn();syncTiersBtn();setBaseFrom(PEOPLE,reports);clearOrgFilter(true);if(orgReady)rebuild();if(orgReady)fitView();renderMatrix();updHist();setHint('Replaced with the imported file.');toast('Loaded '+j.people.length+' contacts from the imported file. Click 💾 Save & Share to keep it.','ok',6000);}
let pendingMerge=null;
function doMerge(j){
 pushUndo();
 const incRep=j.reports||{};
 const anc=(j.base&&j.base.people)?j.base:base;
 let added=0,auto=0;const conflicts=[],needPos=[];
 j.people.forEach(ip=>{const id=ip.id;const cur=byId[id];
  if(!cur){const np=Object.assign({},ip);PEOPLE.push(np);byId[id]=np;reports[id]=incRep[id]||'';if(!pos[id])needPos.push(id);added++;return;}
  const ba=anc.people[id];
  MFIELDS.forEach(([f])=>{const cv=cur[f]===undefined?'':cur[f],iv=ip[f]===undefined?'':ip[f];if(String(cv)===String(iv))return;
    const bv=ba?(ba[f]===undefined?'':ba[f]):undefined;
    if(bv!==undefined&&String(bv)===String(cv)){cur[f]=iv;auto++;}
    else if(bv!==undefined&&String(bv)===String(iv)){}
    else{conflicts.push({id,f,mine:cv,theirs:iv,mineBy:cur.by||'',theirsBy:ip.by||'',mineUpd:cur.updated||'',theirsUpd:ip.updated||'',pick:((ip.updated||'')>(cur.updated||'')?'theirs':'mine')});}
  });
  // photo: prefer a set photo over empty; only ask if both set & differ
  {const cv=cur.photo||'',iv=ip.photo||'';if(cv!==iv){if(!cv&&iv){cur.photo=iv;auto++;}else if(cv&&!iv){}else{conflicts.push({id,f:'photo',mine:cv,theirs:iv,mineBy:cur.by||'',theirsBy:ip.by||'',mineUpd:cur.updated||'',theirsUpd:ip.updated||'',pick:((ip.updated||'')>(cur.updated||'')?'theirs':'mine')});}}}
  // manager
  {const cm=reports[id]||'',im=incRep[id]||'';if(cm!==im){const bm=anc.reports?(anc.reports[id]||''):undefined;
    if(bm!==undefined&&bm===cm){reports[id]=im;auto++;}
    else if(bm!==undefined&&bm===im){}
    else{conflicts.push({id,f:'__mgr',mine:cm,theirs:im,mineBy:cur.by||'',theirsBy:ip.by||'',mineUpd:cur.updated||'',theirsUpd:ip.updated||'',pick:((ip.updated||'')>(cur.updated||'')?'theirs':'mine')});}}}
 });
 if(needPos.length){const ys=Object.values(pos);const baseY=ys.length?Math.max(...ys.map(p=>p.y)):0;const gy=baseY+NH+VGAP+30;needPos.forEach((id,i)=>{pos[id]={x:(i%8)*(NW+HGAP),y:gy+Math.floor(i/8)*(NH+VGAP)};});}
 if(conflicts.length){pendingMerge={conflicts,added,auto};openMergePanel();}
 else{finishMerge(added,auto,0);}
}
function finishMerge(added,auto,resolved){setBaseFrom(PEOPLE,reports);clearOrgFilter(true);if(orgReady){rebuild();fitView();}renderMatrix();scheduleAutosave();updHist();setHint('Merged: '+added+' new, '+auto+' auto-merged'+(resolved?', '+resolved+' resolved':'')+'.');openMergeDone(added,auto,resolved);}
function openMergeDone(added,auto,resolved){const total=added+auto+resolved;const m=document.getElementById('merge');const box=m.querySelector('.box');
 box.innerHTML=`<div style="text-align:center;padding:4px 0 2px"><div style="font-size:40px;line-height:1">${total?'✅':'👍'}</div><b style="font-size:17px">${total?'Merge complete':'Already in sync'}</b></div>
  <div style="display:flex;gap:10px;justify-content:center;margin:14px 0;flex-wrap:wrap">
    <div class="mstat"><div class="mnum">${added}</div><div class="dsub">new contact${added===1?'':'s'}</div></div>
    <div class="mstat"><div class="mnum">${auto}</div><div class="dsub">auto-merged</div></div>
    <div class="mstat"><div class="mnum">${resolved}</div><div class="dsub">you resolved</div></div></div>
  <div class="dsub" style="text-align:center">${total?'Your copy now includes everyone’s edits. Save a fresh copy to keep &amp; share it.':'Both files already matched — nothing needed changing.'}</div>
  <div style="display:flex;justify-content:center;gap:8px;margin-top:16px"><button class="btn" id="mdok">Close</button>${total?'<button class="btn add" id="mdsave">💾 Save &amp; Share now</button>':''}</div>`;
 m.classList.add('on');
 box.querySelector('#mdok').onclick=closeMerge;
 const sv=box.querySelector('#mdsave');if(sv)sv.onclick=()=>{closeMerge();saveFile();};
 toast(total?('Merged: '+added+' new, '+auto+' auto-merged'+(resolved?', '+resolved+' resolved':'')):'Files already in sync — nothing changed.','ok',5200);
}
function cancelMerge(){closeMerge();if(undoStack.length)applyState(undoStack.pop());updHist();pendingMerge=null;toast('Merge cancelled — nothing changed.','info',3800);}
function openMergePanel(){const m=document.getElementById('merge');const box=m.querySelector('.box');
 box.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b>Resolve ${pendingMerge.conflicts.length} conflict(s)</b><button class="btn" id="mgx">✕</button></div>
  <div class="dsub" style="margin:8px 0 12px">${pendingMerge.added} new contact(s) added · ${pendingMerge.auto} field(s) auto-merged. You both changed these — pick which value to keep (newer edit is pre-selected):</div>
  <div style="display:flex;gap:8px;margin-bottom:6px"><button class="btn" id="allmine">Keep all mine</button><button class="btn" id="alltheirs">Keep all theirs</button></div>
  <div id="cflist"></div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn" id="mgcancel">Cancel merge</button><button class="btn add" id="mgapply">Apply ✓</button></div>`;
 renderCf();m.classList.add('on');
 box.querySelector('#mgx').onclick=cancelMerge;box.querySelector('#mgcancel').onclick=cancelMerge;
 box.querySelector('#allmine').onclick=()=>{pendingMerge.conflicts.forEach(c=>c.pick='mine');renderCf();};
 box.querySelector('#alltheirs').onclick=()=>{pendingMerge.conflicts.forEach(c=>c.pick='theirs');renderCf();};
 box.querySelector('#mgapply').onclick=applyMerge;
}
function renderCf(){const list=document.getElementById('cflist');
 list.innerHTML=pendingMerge.conflicts.map((c,i)=>{const nm=byId[c.id]?byId[c.id].name:c.id;
  const mw='Mine'+(c.mineBy?' ('+esc(c.mineBy)+')':'')+(c.mineUpd?' · '+fmtDate(c.mineUpd):'');
  const tw='Theirs'+(c.theirsBy?' ('+esc(c.theirsBy)+')':'')+(c.theirsUpd?' · '+fmtDate(c.theirsUpd):'');
  return `<div class="cfrow"><div style="font-weight:600">${esc(nm)} · <span class="dsub">${fLabel(c.f)}</span></div>
   <div class="opt"><button data-i="${i}" data-p="mine" class="${c.pick==='mine'?'pick':''}"><span class="who">${mw}</span>${esc(vStr(c.f,c.mine))}</button><button data-i="${i}" data-p="theirs" class="${c.pick==='theirs'?'pick':''}"><span class="who">${tw}</span>${esc(vStr(c.f,c.theirs))}</button></div></div>`;}).join('');
 list.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>{pendingMerge.conflicts[+b.dataset.i].pick=b.dataset.p;renderCf();});
}
function applyMerge(){pendingMerge.conflicts.forEach(c=>{const val=c.pick==='theirs'?c.theirs:c.mine;if(c.f==='__mgr')reports[c.id]=val;else byId[c.id][c.f]=val;});
 const a=pendingMerge.added,au=pendingMerge.auto,n=pendingMerge.conflicts.length;closeMerge();finishMerge(a,au,n);pendingMerge=null;}

function deriveInit(name){const parts=(name||'').trim().split(/\s+/).filter(Boolean);if(!parts.length)return '';if(parts.length===1)return parts[0].slice(0,2).toUpperCase();return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();}
function saveUser(name,init){try{localStorage.setItem(USERKEY,JSON.stringify({name:name,init:init}));}catch(e){}}
function saveUserInit(init){try{const s=localStorage.getItem(USERKEY);const u=s?JSON.parse(s):{};u.init=init;localStorage.setItem(USERKEY,JSON.stringify(u));}catch(e){}}
function promptUser(){const m=document.getElementById('merge');const box=m.querySelector('.box');const inSt="width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px 10px;font-size:14px;margin-top:4px";
 box.innerHTML=`<b>Welcome — who’s editing?</b><div class="dsub" style="margin:8px 0 12px">Add your name so any changes you make are stamped with your initials (for timestamps & merge tracking). Saved in THIS browser only — you won’t be asked again here.</div>
  <label class="dsub">Your name (First Last)</label>
  <input id="uname" placeholder="e.g. Nathan Burrows" style="${inSt}">
  <div class="dsub" style="margin-top:10px">Your initials: <b id="uinit" style="color:var(--tx);font-size:14px">—</b></div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn" id="uskip">Skip for now</button><button class="btn add" id="usave">Save</button></div>`;
 m.classList.add('on');
 const un=box.querySelector('#uname'),ui=box.querySelector('#uinit');
 un.addEventListener('input',()=>{ui.textContent=deriveInit(un.value)||'—';});
 setTimeout(()=>un.focus(),40);
 box.querySelector('#uskip').onclick=closeMerge;
 box.querySelector('#usave').onclick=()=>{const nm=un.value.trim();if(!nm){un.focus();return;}const init=deriveInit(nm);meInit=init;saveUser(nm,init);const mi=document.getElementById('meinit');if(mi)mi.value=init;closeMerge();scheduleAutosave();setHint('Thanks '+nm.split(/\s+/)[0]+' — your edits will be tagged “'+init+'”.');};
 un.addEventListener('keydown',e=>{if(e.key==='Enter')box.querySelector('#usave').click();});
}
function initUser(){let u=null;try{const s=localStorage.getItem(USERKEY);if(s)u=JSON.parse(s);}catch(e){}
 if(u&&u.init){meInit=u.init;const mi=document.getElementById('meinit');if(mi)mi.value=meInit;}
 else{promptUser();}}
document.getElementById('save').onclick=saveFile;
document.getElementById('undo').onclick=undo;
document.getElementById('redo').onclick=redo;
document.getElementById('org-del').onclick=delNode;
document.getElementById('newacct').onclick=newAccountFlow;
document.getElementById('clearacct').onclick=clearAccountFlow;
document.getElementById('acctrename').onclick=renameAccountFlow;
document.getElementById('acctdel').onclick=deleteAccountFlow;
document.getElementById('acctsel').onchange=e=>{const v=e.target.value;
 if(v==='__new__'){refreshAcctPicker();newAccountFlow();}
 else if(v==='__all__'){viewAll=true;refreshAcctPicker();activateTab('portfolio');}
 else{viewAll=false;if(v!==curAcct){switchAccount(v);}else{refreshAcctPicker();updateHeader();const onPort=!document.getElementById('portfolio').classList.contains('hide');if(onPort)renderPortfolio();else activateTab('matrix');}}};
document.addEventListener('keydown',e=>{
 if(document.getElementById('viewport').classList.contains('hide'))return;
 if(document.querySelector('.nnm[contenteditable="true"]'))return;
 const t=e.target.tagName; if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA')return;
 const mod=e.ctrlKey||e.metaKey;
 if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();}
 else if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();}
 else if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();saveFile();}
 else if((e.key==='Delete'||e.key==='Backspace')&&sel){e.preventDefault();delNode();}
});
applyTheme();renderLogo();refreshAcctPicker();updateHeader();renderMatrix();updHist();initUser();
</script></body></html>
